<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Split Sleeper Berth Break Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style type="css">


    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <label for="firstBreak">Length of First Break: </label>
                <input type="text" name="firstBreak">
            </div>

            <div class="col-6">
                <label for="secondBreak">Length of Second Break: </label>
                <input type="text" name="secondBreak">
            </div>
        </div>

        <div class="row">
            <div class="col-6">
                <label for="hoursWorkedBetweenBreaks">Hours On-Duty Between Breaks: </label>
                <input type="text" name="hoursWorkedBetweenBreaks">
            </div>

            <div class="col-6">
                <label for="hoursDrivenBetweenBreaks">Hours Driven Between Breaks: </label>
                <input type="text" name="hoursDrivenBetweenBreaks">
            </div>
        </div>

        <div class="row">
            <button id="submit">Submit</button>
        </div>
    </div>
    </div>

    <script src="split_sleeper_calc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
